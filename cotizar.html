<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cotización | Ruta Motors </title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <img src="img/logo.png" alt="Logo Concesionario" class="logo">
        <h1>Ruta Motors</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="cotizar.html">Cotizar Moto</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

<main>
        <section class="tarjeta" style="margin-top: 24px;">
            <h2>Cotiza tu Motocicleta o Agenda Test Drive</h2>
            <p>Diligencia el siguiente formulario para recibir información comercial detallada.</p>

            <!-- Inicio del Formulario -->
            <form id="form-cotizacion" action="#" method="POST" novalidate>
                
                <div class="form-grid">
                    <!-- Fila 1 -->

                    <!-- Campo Tipo Text - Nombre -->
                    <div class="campo">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" required maxlength="100" placeholder="Ej. Marc Márquez Alentà">
                    </div>

                    <!-- Campo Tipo Number - Cédula -->
                    <div class="campo">
                        <label for="cedula">Número de Cédula:</label>
                        <input type="number" id="cedula" name="cedula" required placeholder="Ej. 1024568512" oninput="if (this.value.length > 10) this.value = this.value.slice(0, 10);">
                    </div>

                    <!-- Fila 2 -->

                    <!-- Campo Tipo Email -->
                    <div class="campo">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo" required placeholder="marc_marquez@gmail.com">
                    </div>

                    <!-- Campo Tipo Number - Número de Celular -->
                    <div class="campo">
                        <label for="telefono">Número de Celular:</label>
                        <input type="number" id="telefono" name="telefono" required min="3000000000" max="3999999999" placeholder="Ej. 3001234567" oninput="if (this.value.length > 10) this.value = this.value.slice(0, 10);">
                    </div>

                    <!-- Fila 3: Abarca 2 columnas -->
                    
                    <!-- Campo Tipo Select - Modelo de Interés -->
                    <div class="campo campo-full">
                        <label for="modelo">Modelo de Interés:</label>
                        <select id="modelo" name="modelo" required>
                            <option value="">Selecciona una moto</option>
                            <option value="CB100">CB 100 2027</option>
                            <option value="CB125F">CB 125F 2027</option>
                            <option value="CB190R">CB 190R 2.0 2027</option>
                            <option value="CB125HORNET">CB 125 HORNET 2027</option>
                        </select>
                    </div>

                    <!-- Fila 4 -->

                    <!-- Campo Tipo Date  - Fecha preferida -->
                    <div class="campo">
                        <label for="fecha">Fecha preferida para atención:</label>
                        <input type="date" id="fecha" name="fecha">
                    </div>

                    <!-- Campo Tipo Time - Hora preferida -->
                    <div class="campo">
                        <label for="hora">Hora preferida para atención:</label>
                        <input type="time" id="hora" name="hora">
                    </div>
                </div>

                <!-- Mensaje de error/éxito para JS -->
                <div id="mensaje-error-cotizar" style="font-weight: bold; margin-top: 15px;"></div>

                <!-- Botón de envío -->
                <div style="text-align: center; margin-top: 20px;">
                    <button type="submit" class="boton" style="border: none; cursor: pointer; width: 200px;">Enviar Cotización</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ruta Motors - Todos los derechos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
